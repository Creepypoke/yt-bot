services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DOWNLOAD_DIR: /app/downloads
      INSTAGRAM_COOKIES: /run/secrets/cookies.txt
      YOUTUBE_COOKIES: /run/secrets/cookies.txt
      YOUTUBE_POT_PROVIDER_URL: http://pot-provider:4416
    init: true
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - type: bind
        source: /data/coolify/secrets/yt-bot/cookies.txt
        target: /run/secrets/cookies.txt
        read_only: true
      - type: volume
        source: video-downloads
        target: /app/downloads
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    init: true
    restart: unless-stopped

volumes:
  video-downloads:
